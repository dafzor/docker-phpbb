<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /phpbb/www

    <Directory /phpbb/www>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    RedirectMatch 404 /\..*$
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
